<title>CMDB Data Foundations Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
/* Layout: one centred column; setup -> question card -> results. Quiet slate surfaces, one teal accent, mono for table names. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface2:#f4f7f9; --line:#d5dde4; --fg:#12202b; --muted:#566878;
  --accent:#0a6c88; --accent-ink:#ffffff; --accent-soft:#dcedf2;
  --good:#16793a; --good-soft:#dff3e5; --bad:#b3261e; --bad-soft:#fbe4e1;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#16212b; --surface2:#1b2833; --line:#2c3b49; --fg:#e6edf2; --muted:#9bacba;
  --accent:#4cc3e0; --accent-ink:#06222b; --accent-soft:#16363f;
  --good:#5fd07f; --good-soft:#163524; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#16212b; --surface2:#1b2833; --line:#2c3b49; --fg:#e6edf2; --muted:#9bacba;
  --accent:#4cc3e0; --accent-ink:#06222b; --accent-soft:#16363f;
  --good:#5fd07f; --good-soft:#163524; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
code{font-family:var(--mono);font-size:.88em;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.stat{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.topic{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;min-width:0}
.topic input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.topic span.n{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--muted);padding-left:8px}
.topic span.l{min-width:0}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}
select{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{accent-color:var(--accent);width:16px;height:16px}
button{font:inherit;font-weight:700;border-radius:8px;padding:11px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.opt:focus-within,.topic:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.tag{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;color:var(--accent)}
.q{font-size:1.15rem;line-height:1.45;font-weight:500;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;min-width:0}
.opt:hover{background:var(--surface2)}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:3px;flex:none;width:1.1em}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.locked .opt{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mark{margin-left:auto;font-weight:700;font-size:.82rem;flex:none;padding-left:8px}
.opt.right .mark{color:var(--good)} .opt.wrong .mark{color:var(--bad)}
.verdict{border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--surface2)}
.verdict.good{border-color:var(--good);background:var(--good-soft)} .verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.verdict b{display:block;margin-bottom:2px}
.score{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.break{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.brow .bar{height:8px}
.brow .v{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:10px}
.miss article{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface2);display:flex;flex-direction:column;gap:4px;min-width:0}
.miss p{margin:0;overflow-wrap:anywhere}
.miss .you{color:var(--bad)} .miss .ans{color:var(--good)}
@media (max-width:480px){.brow{grid-template-columns:1fr auto}.brow .bar{grid-column:1/-1;order:3}.panel{padding:16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>CMDB Data Foundations Drill</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="stat" id="lifetime"></div>
  </header>
  <section id="setup" class="panel"></section>
  <section id="quiz" class="panel" hidden></section>
  <section id="result" class="panel" hidden></section>
</div>

<script>
var BANK = /*DATA*/[];
var TOPICS = /*TOPICS*/{};
(function(){
  var $ = function(id){return document.getElementById(id)};
  var store = {
    get: function(){try{return JSON.parse(localStorage.getItem('cmdbDrill.v1')||'{}')}catch(e){return {}}},
    set: function(v){try{localStorage.setItem('cmdbDrill.v1',JSON.stringify(v))}catch(e){}}
  };
  var saved = store.get(); saved.hist = saved.hist || {}; saved.prefs = saved.prefs || {};
  var S = null; // session

  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    for (var k in (attrs||{})) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){ if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function rich(text){ // `code` spans
    var f = document.createDocumentFragment();
    String(text).split('`').forEach(function(p,i){ f.appendChild(i % 2 ? el('code',{text:p}) : document.createTextNode(p)); });
    return f;
  }
  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function show(id){ ['setup','quiz','result'].forEach(function(s){ $(s).hidden = s !== id; }); window.scrollTo(0,0); }
  function pct(a,b){ return b ? Math.round(100*a/b) : 0; }

  $('subtitle').textContent = BANK.length + ' questions across ' + Object.keys(TOPICS).length + ' topics. Pick an answer, submit, and see the right answer with the reason.';

  function lifetime(){
    var r=0,w=0; for (var id in saved.hist){ r += saved.hist[id].r||0; w += saved.hist[id].w||0; }
    $('lifetime').textContent = (r+w) ? ('All time: ' + r + '/' + (r+w) + ' correct (' + pct(r,r+w) + '%)') : '';
  }

  /* ---------- setup ---------- */
  function renderSetup(){
    lifetime();
    var box = $('setup'); box.textContent = '';
    var counts = {}; BANK.forEach(function(q){ counts[q.t] = (counts[q.t]||0)+1; });
    var chosen = saved.prefs.topics || Object.keys(TOPICS);
    box.appendChild(el('h2',{text:'Topics'}));
    var grid = el('div',{class:'topics'});
    Object.keys(TOPICS).forEach(function(t){
      var cb = el('input',{type:'checkbox',id:'tp-'+t,value:t}); cb.checked = chosen.indexOf(t) > -1;
      grid.appendChild(el('label',{class:'topic',for:'tp-'+t},[cb, el('span',{class:'l',text:TOPICS[t]}), el('span',{class:'n',text:String(counts[t]||0)})]));
    });
    box.appendChild(grid);
    var sel = el('select',{id:'count'});
    [10,25,50,100,0].forEach(function(n){ var o = el('option',{value:String(n),text:n ? n + ' questions' : 'All matching'}); sel.appendChild(o); });
    sel.value = String(saved.prefs.count != null ? saved.prefs.count : 25);
    var ord = el('select',{id:'order'});
    [['shuffle','Shuffled'],['bank','Bank order']].forEach(function(o){ ord.appendChild(el('option',{value:o[0],text:o[1]})); });
    ord.value = saved.prefs.order || 'shuffle';
    var weak = el('input',{type:'checkbox',id:'weak'}); weak.checked = !!saved.prefs.weak;
    var fresh = el('input',{type:'checkbox',id:'fresh'}); fresh.checked = !!saved.prefs.fresh;
    box.appendChild(el('div',{class:'row'},[
      el('div',{class:'field'},[el('label',{for:'count',class:'sub',text:'Length'}), sel]),
      el('div',{class:'field'},[el('label',{for:'order',class:'sub',text:'Order'}), ord]),
      el('div',{class:'field'},[
        el('label',{class:'check',for:'weak'},[weak,'Only questions I got wrong before']),
        el('label',{class:'check',for:'fresh'},[fresh,'Skip questions I answered correctly'])])
    ]));
    var msg = el('p',{class:'sub',id:'setupmsg'});
    var go = el('button',{id:'start',text:'Start quiz',onclick:function(){
      var topics = Array.prototype.map.call(grid.querySelectorAll('input:checked'), function(i){return i.value});
      saved.prefs = {topics:topics,count:parseInt(sel.value,10),order:ord.value,weak:weak.checked,fresh:fresh.checked}; store.set(saved);
      var pool = BANK.filter(function(q){
        if (topics.indexOf(q.t) < 0) return false;
        var h = saved.hist[q.id]||{};
        if (weak.checked && !(h.w > 0 && (h.last === 'w'))) return false;
        if (fresh.checked && h.last === 'r') return false;
        return true;
      });
      if (!pool.length){ msg.textContent = 'No questions match those settings. Pick more topics or clear a filter.'; return; }
      if (ord.value === 'shuffle') pool = shuffle(pool);
      var n = saved.prefs.count; if (n && n < pool.length) pool = pool.slice(0,n);
      begin(pool);
    }});
    var reset = el('button',{class:'ghost',text:'Clear my history',onclick:function(){
      if (reset.dataset.armed){ saved.hist = {}; store.set(saved); renderSetup(); return; }
      reset.dataset.armed = '1'; reset.textContent = 'Click again to confirm';
    }});
    box.appendChild(msg);
    box.appendChild(el('div',{class:'actions'},[reset,go]));
    show('setup');
  }

  /* ---------- quiz ---------- */
  function begin(pool){
    S = {pool:pool, i:0, right:0, answers:[], locked:false, picked:null, opts:null};
    renderQ();
  }
  function renderQ(){
    var q = S.pool[S.i], box = $('quiz'); box.textContent = '';
    S.locked = false; S.picked = null;
    S.opts = shuffle([{t:q.a,ok:true}].concat(q.w.map(function(w){return {t:w,ok:false}})));
    var barI = el('i'); barI.style.width = (100*S.i/S.pool.length) + '%';
    box.appendChild(el('div',{class:'bar'},[barI]));
    box.appendChild(el('div',{class:'meta'},[
      el('span',{class:'tag',text:TOPICS[q.t]}),
      el('span',{text:'Question ' + (S.i+1) + ' of ' + S.pool.length + '  ·  Score ' + S.right + '/' + S.i})]));
    var p = el('p',{class:'q',id:'qtext'}); p.appendChild(rich(q.q)); box.appendChild(p);
    var fs = el('div',{class:'opts',role:'radiogroup','aria-labelledby':'qtext'});
    S.opts.forEach(function(o,i){
      var inp = el('input',{type:'radio',name:'ans',id:'o'+i,value:String(i)});
      var lab = el('label',{class:'opt',for:'o'+i,'data-i':String(i)},[inp, el('span',{class:'k',text:'ABCD'[i]}), el('span',{class:'t'},[rich(o.t)])]);
      inp.addEventListener('change',function(){ if (S.locked) return; S.picked = i;
        fs.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel')}); lab.classList.add('sel'); submit.disabled = false; });
      fs.appendChild(lab);
    });
    box.appendChild(fs);
    var fb = el('div',{id:'fb'});
    box.appendChild(fb);
    var submit = el('button',{id:'submit',text:'Submit answer',disabled:'',onclick:doSubmit});
    var quit = el('button',{class:'ghost',text:'End quiz',onclick:finish});
    box.appendChild(el('div',{class:'actions'},[quit,submit]));
    show('quiz');
    box.querySelector('.opt input').focus({preventScroll:true});
  }
  function doSubmit(){
    if (S.locked || S.picked == null) return;
    S.locked = true;
    var q = S.pool[S.i], ok = S.opts[S.picked].ok;
    if (ok) S.right++;
    S.answers.push({q:q, ok:ok, you:S.opts[S.picked].t});
    var h = saved.hist[q.id] || {r:0,w:0}; if (ok) h.r++; else h.w++; h.last = ok ? 'r' : 'w'; saved.hist[q.id] = h; store.set(saved);
    var box = $('quiz'); box.classList.add('locked');
    box.querySelectorAll('.opt').forEach(function(l,i){
      l.querySelector('input').disabled = true;
      if (S.opts[i].ok){ l.classList.add('right'); l.appendChild(el('span',{class:'mark',text:'Correct answer'})); }
      else if (i === S.picked){ l.classList.add('wrong'); l.appendChild(el('span',{class:'mark',text:'Your answer'})); }
    });
    var v = el('div',{class:'verdict ' + (ok ? 'good':'bad'),role:'status'},[
      el('b',{text: ok ? 'Correct' : 'Not quite. The right answer is highlighted above.'})]);
    var why = el('span'); why.appendChild(rich(q.e)); v.appendChild(why);
    $('fb').appendChild(v);
    var last = S.i === S.pool.length - 1;
    var btn = $('submit'); btn.disabled = false; btn.textContent = last ? 'See results' : 'Next question'; btn.onclick = last ? finish : function(){ S.i++; box.classList.remove('locked'); renderQ(); };
    btn.focus({preventScroll:true});
  }
  function finish(){
    var box = $('result'); box.textContent = ''; $('quiz').classList.remove('locked');
    var total = S.answers.length;
    if (!total){ renderSetup(); return; }
    box.appendChild(el('h2',{text:'Results'}));
    box.appendChild(el('div',{class:'score',text:pct(S.right,total) + '%'}));
    box.appendChild(el('p',{class:'sub',text:S.right + ' of ' + total + ' correct' + (total < S.pool.length ? ' (quiz ended early; ' + (S.pool.length-total) + ' unanswered)' : '')}));
    var by = {}; S.answers.forEach(function(a){ var b = by[a.q.t] = by[a.q.t]||{r:0,n:0}; b.n++; if (a.ok) b.r++; });
    var br = el('div',{class:'break'});
    Object.keys(by).forEach(function(t){
      var i = el('i'); i.style.width = pct(by[t].r,by[t].n) + '%';
      br.appendChild(el('div',{class:'brow'},[el('span',{text:TOPICS[t]}), el('div',{class:'bar'},[i]), el('span',{class:'v',text:by[t].r + '/' + by[t].n + ' · ' + pct(by[t].r,by[t].n) + '%'})]));
    });
    box.appendChild(el('h2',{text:'By topic'})); box.appendChild(br);
    var missed = S.answers.filter(function(a){return !a.ok});
    if (missed.length){
      box.appendChild(el('h2',{text:'Review what you missed (' + missed.length + ')'}));
      var list = el('div',{class:'miss'});
      missed.forEach(function(a){
        var q = el('p'); q.appendChild(rich(a.q.q));
        var y = el('p',{class:'you'}); y.appendChild(document.createTextNode('Your answer: ')); y.appendChild(rich(a.you));
        var r = el('p',{class:'ans'}); r.appendChild(document.createTextNode('Correct: ')); r.appendChild(rich(a.q.a));
        var e = el('p',{class:'sub'}); e.appendChild(rich(a.q.e));
        list.appendChild(el('article',{},[q,y,r,e]));
      });
      box.appendChild(list);
    }
    var again = [];
    if (missed.length) again.push(el('button',{class:'ghost',text:'Retry missed questions',onclick:function(){ begin(shuffle(missed.map(function(a){return a.q}))); }}));
    again.push(el('button',{text:'New quiz',onclick:renderSetup}));
    box.appendChild(el('div',{class:'actions'},again));
    lifetime(); show('result');
  }
  document.addEventListener('keydown',function(e){
    if ($('quiz').hidden || e.target.tagName === 'SELECT') return;
    if (/^[1-4]$/.test(e.key) && !S.locked){ var inp = document.getElementById('o'+(+e.key-1)); if (inp){ inp.checked = true; inp.dispatchEvent(new Event('change')); } }
    else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON'){ var b = $('submit'); if (b && !b.disabled) b.click(); }
  });
  renderSetup();
})();
</script>
